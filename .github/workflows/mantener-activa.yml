# Supabase pausa los proyectos gratuitos tras una semana sin uso.
# Esta tarea hace una consulta mínima cada 3 días para que no ocurra en vacaciones.
name: Mantener activa la base de datos
on:
  schedule:
    - cron: '17 7 */3 * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a Supabase
        run: |
          curl -fsS -X POST "https://mnfkzidvwgnqyvaidczt.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_oX5DsKI3WIhqkY-j6EDgKg_jJ84vVwh" \
            -H "Content-Type: application/json" -d '{}'
